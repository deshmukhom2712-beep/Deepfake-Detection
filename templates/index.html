<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload Image</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; color:#111; }
    .wrap { max-width: 520px; margin: 0 auto; }
    .card { border:1px solid #e5e7eb; border-radius:10px; padding:18px; }
    .btn { padding:10px 16px; border:0; background:#111827; color:#fff; border-radius:8px; cursor:pointer; }
    .note { color:#6b7280; font-size: 14px; margin-top:8px; }
    .flash { background:#fff6f6; border:1px solid #f5c2c7; padding:10px; border-radius:8px; margin-bottom:10px; color:#b91c1c;}
  </style>
</head>
<body>
  <div class="wrap">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h2>Deepfake Detector</h2>
    <div class="card">
      <form method="POST" action="{{ url_for('predict') }}" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <div style="margin-top:12px">
          <button class="btn" type="submit">Analyze</button>
        </div>
        <div class="note">Only JPG/PNG/BMP/WEBP.</div>
      </form>
    </div>
  </div>
</body>
</html>
